<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Steam</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Eyni stilləri login.html-dən istifadə edə bilərsiniz */
        .auth-container { max-width: 400px; margin: 100px auto; padding: 2rem; background-color: #1b2838; color: #c7d5e0; border-radius: 5px; }
        .auth-container h1 { text-align: center; }
        .auth-form input { width: 100%; padding: 10px; margin-bottom: 15px; background-color: #323d4b; border: 1px solid #000; color: #fff; border-radius: 3px; }
        .auth-form button { width: 100%; padding: 12px; background-color: #5c7e10; border: none; color: #fff; cursor: pointer; border-radius: 3px; font-size: 16px; }
        .auth-form button:hover { background-color: #6d9a13; }
        .auth-link { text-align: center; margin-top: 15px; }
        .auth-link a { color: #66c0f4; text-decoration: none; }
        #error-message { color: #ff6b6b; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>Create Account</h1>
        <div id="error-message"></div>
        <form id="register-form" class="auth-form">
            <input type="text" id="fullname" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Create Account</button>
        </form>
        <div class="auth-link">
            <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
